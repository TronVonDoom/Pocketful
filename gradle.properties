# The app's version, in one place. composeApp/build.gradle.kts feeds these to the Android
# manifest and generates AppVersion.kt from them, and the in-app updater compares NAME
# against the tag of the newest GitHub release. Bump before tagging a release.
pocketful.versionName=0.1.0
pocketful.versionCode=1
