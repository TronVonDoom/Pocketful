# Cuts a release APK when a version tag is pushed, and attaches it to a GitHub release.
#
# This is the other half of the in-app updater: Settings -> Updates reads the release this
# workflow publishes, so a tag pushed here becomes an update offer on every installed copy
# of the app. Nothing else publishes releases, which is what keeps "the newest tag" and
# "the newest installable build" the same thing.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Buildable by hand as well, for a dry run that produces an artifact and no release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Restores the signing key from repository secrets, if they are configured. Without
      # them the build falls back to the debug key -- which still produces installable,
      # self-updating APKs, as long as every release is built here rather than locally.
      # See the README: an update signed with a different key is refused by Android.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKETFUL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pocketful.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key configured; falling back to the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          POCKETFUL_KEYSTORE_FILE: ${{ steps.signing.outputs.signed == 'true' && format('{0}/pocketful.jks', runner.temp) || '' }}
          POCKETFUL_KEYSTORE_PASSWORD: ${{ secrets.POCKETFUL_KEYSTORE_PASSWORD }}
          POCKETFUL_KEY_ALIAS: ${{ secrets.POCKETFUL_KEY_ALIAS }}
          POCKETFUL_KEY_PASSWORD: ${{ secrets.POCKETFUL_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease --no-daemon

      # Named for the tag, because the filename is what a user sees in their downloads and
      # "composeApp-release.apk" says nothing about which version it is.
      - name: Name the artifact
        id: artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="$(git rev-parse --short HEAD)"
          NAME="pocketful-${VERSION}.apk"
          mv composeApp/build/outputs/apk/release/composeApp-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.name }}

      # Only a tag becomes a release. A manual run leaves the APK as a workflow artifact,
      # so a dry run cannot accidentally offer itself to everyone's Settings screen.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          APK: ${{ steps.artifact.outputs.name }}
        run: |
          {
            echo "Install from inside the app -- **Settings -> Updates** -- or download the APK below."
            echo
            echo "Built from ${GITHUB_SHA:0:7}."
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "> Signed with the debug key. Installs and self-updates normally, so long as"
              echo "> every release is built by this workflow rather than locally."
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --notes-file notes.md
